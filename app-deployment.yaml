apiVersion: apps/v1
kind: Deployment
metadata:
  name: memollection-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memollection-app
  template:
    metadata:
      labels:
        app: memollection-app
    spec:
      containers:
        - name: memollection-app
          image: registry.kb/memollection/app:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: FLASK_ENV
              value: "production"
            - name: DATABASE_HOST
              value: "mysql-db"
            - name: DATABASE_USER
              value: "root"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: DATABASE_NAME
              value: "memollection"
            - name: DATABASE_PORT
              value: "3306"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: memollection-app-svc
spec:
  selector:
    app: memollection-app
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9999
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memollection-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - memollection.kb
      secretName: memollection-tls
  rules:
    - host: memollection.kb
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memollection-app-svc
                port:
                  number: 80
                                